name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject config
        run: |
          cat > config.js << 'EOF'
          const SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';
          const SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}';
          const COMMISH_PASSWORD = '${{ secrets.COMMISH_PASSWORD }}';
          EOF
          # Remove config.js from .gitignore so peaceiris picks it up
          sed -i '/^config\.js$/d' .gitignore

      - name: Cache-bust JS/CSS
        run: |
          SHA="${{ github.sha }}"
          V="${SHA:0:8}"
          # Append commit SHA to app.js, style.css, config.js, rsvp.js so browsers always get fresh files
          sed -i "s|src=\"app\.js\"|src=\"app.js?v=$V\"|g" index.html
          sed -i "s|src=\"config\.js\"|src=\"config.js?v=$V\"|g" index.html rsvp.html
          sed -i "s|src=\"rsvp\.js\"|src=\"rsvp.js?v=$V\"|g" rsvp.html
          sed -i "s|href=\"style\.css\"|href=\"style.css?v=$V\"|g" index.html rsvp.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,config.example.js'
