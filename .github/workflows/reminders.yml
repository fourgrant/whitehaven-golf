name: Send Round Reminders

# Off the top of the hour, when GitHub's scheduler is least backed up. Runs can
# still start hours late; the script won't post during quiet hours (11 PM–6 AM Central).
on:
  schedule:
    # Daily at 6:13PM UTC (~1PM Central). Posts a GroupMe reminder when a round is tomorrow.
    - cron: '13 18 * * *'
    # Daily at 2:17AM UTC (~9PM Central). Posts the RSVP list if it changed since the last one.
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.schedule == '17 2 * * *' && 'evening' || 'reminder' }}
        run: node scripts/send-reminders.js
